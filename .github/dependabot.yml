version: 2
updates:
  # Keep pinned GitHub Actions current; version pins without an update channel
  # go stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # Keep the digest-pinned reference Dockerfile images current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
