# Produces the golangci-lint report that lint-review.yml posts as inline PR
# review comments. This workflow runs untrusted pull request code with a
# read-only token and no secrets; the posting workflow never executes PR
# code. The blocking lint gate remains the lint job in ci.yml.
name: Lint report

on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Same pinned action and version as the ci.yml lint job.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Run golangci-lint (report only)
        # Issues are reported by lint-review.yml and gated by ci.yml; a lint
        # finding here must not fail this report job.
        continue-on-error: true
        run: golangci-lint run --output.text.path=golangci-lint-report.txt ./...

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golangci-lint-report
          path: golangci-lint-report.txt
          if-no-files-found: ignore
          retention-days: 7
